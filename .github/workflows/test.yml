name: Offline tests and packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Integration tests (no HA or BLE connection)
        run: python -B -m unittest discover -s tests -v
      - name: Protocol tests (synthetic data only)
        run: python -B -m unittest discover -s tests/protocol -v
      - name: Build packages
        run: python -B tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: yutai-ble-python-${{ matrix.python-version }}
          path: dist/*
