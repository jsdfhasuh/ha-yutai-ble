name: Tests and packages
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      publish_release: ${{ steps.release_gate.outputs.publish }}
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check explicit release commit
        id: release_gate
        run: python -B tools/publish_release.py --check-trigger
      - name: Integration tests (no HA or BLE connection)
        run: python -B -m unittest discover -s tests -v
      - name: Protocol tests (synthetic data only)
        run: python -B -m unittest discover -s tests/protocol -v
      - name: Build packages
        run: python -B tools/build_release.py
      - name: Yutai fsov7m research tests (offline only)
        run: python -B -m unittest discover -s research/yutai_fsov7m -v
      - name: Wiing v7icm research tests (offline only)
        run: python -B -m unittest discover -s research/wiing_v7icm -v
      - uses: actions/upload-artifact@v4
        with:
          name: yutai-ble-python-${{ matrix.python-version }}
          path: dist/*

  home_assistant:
    name: Home Assistant framework
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install tested Home Assistant version
        run: python -m pip install homeassistant==2026.10.4
      - name: Real coordinator and entity diagnostics (no BLE)
        run: python -B -m unittest discover -s tests/ha -v

  windows_auth:
    name: Windows authentication launcher
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Launcher recovery with real cmd.exe (no cloud login)
        run: python -B -m unittest discover -s tests/windows -v

  release:
    name: Publish tested release
    needs: [test, home_assistant, windows_auth]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: yutai-ble-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: yutai-ble-python-3.13
          path: dist
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/publish_release.py
